[workspace]
members = ["crates/sky-assets", "crates/sky-pt", "crates/sky-reference", "crates/sky-realtime", "crates/cloud-pt", "apps/sky-baker", "apps/sky-demo", "apps/sky-audit", "apps/cloud-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
exr = "1.73"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.8"
wgpu = "29.0.3"
winit = "0.30"
